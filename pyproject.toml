[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tm1-data-dictionary"
version = "0.1.0"
description = "Native TM1 data dictionary: static parser + }Meta_* schema for IBM Planning Analytics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Zameel Arif", email = "your-email@cubewise.com" },
]
keywords = ["tm1", "planning-analytics", "data-dictionary", "lineage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "TM1py>=2.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "click>=8.1",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
tm1dd = "tm1_data_dictionary.cli:main"

[project.urls]
Repository = "https://github.com/zameelarif/tm1-data-dictionary"

# ---------- Tool configs ----------

[tool.hatch.build.targets.wheel]
packages = ["src/tm1_data_dictionary"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
]
ignore = [
    "E501",  # line too long — black handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=tm1_data_dictionary",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "integration: tests that require a running TM1 instance",
    "slow: tests that take more than 5 seconds",
]

[tool.coverage.run]
source = ["src/tm1_data_dictionary"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
